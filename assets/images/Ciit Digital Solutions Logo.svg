<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2A5C"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <g transform="translate(10,10)">
    <circle cx="120" cy="120" r="112" fill="url(#badgeGrad)"/>

    <!-- Stylized "C" arc, open to the right -->
    <path d="M 183.89 164.74 A 78 78 0 1 1 183.89 75.26"
          fill="none" stroke="#FFFFFF" stroke-width="27"
          stroke-linecap="round"/>

    <!-- Fast connection line cutting across the opening (speed / short turn-around) -->
    <line x1="183.89" y1="75.26" x2="183.89" y2="164.74"
          stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>

    <!-- Connection nodes -->
    <circle cx="183.89" cy="75.26" r="9" fill="#FFFFFF"/>
    <circle cx="183.89" cy="164.74" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, 'Segoe UI', Helvetica, sans-serif">
    <text x="270" y="150" font-size="92" font-weight="700" fill="url(#textGrad)" letter-spacing="1">Ciit</text>
    <text x="272" y="196" font-size="30" font-weight="600" fill="#0891B2" letter-spacing="6">DIGITAL SOLUTIONS</text>
  </g>
</svg>
